[package]
name = "agent-nextup"
version.workspace = true
description = "Agent NextUp desktop app: Tauri v2 shell hosting the workspace engine, project GUI and embedded agent terminal."
authors = ["white1024"]
edition = "2021"
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_nextup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# 2.7 finds target/ by walking up from OUT_DIR; 2.6 assumed a fixed depth, and
# under Rust 1.100's build-dir layout it copied the hub sidecar onto the hub
# crate's own build directory (rust-toolchain.toml).
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
nextup-core = { path = "../crates/nextup-core" }
tauri = { version = "2.12.6", features = [] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
portable-pty = "0.9"
# In-app update, user-triggered (D144). Its own minor, matched by
# @tauri-apps/plugin-updater in package.json (the CLI refuses mismatched
# minors). It was held at ~2.12 while the app stayed on tauri 2.11; the move
# to tauri 2.12 (and tao/wry with it) was its own commit, re-checked against
# the quit path (G065) and the middle-click behaviour (G070).
tauri-plugin-updater = "~2.14"

# macOS quit path only (G065). Already in the tree via tao, so this pulls in
# nothing new — it just lets us name `NSApplication terminate:` directly,
# which is the one shutdown sequence AppKit does not crash on.
# Native title bar colour and caption (titlebar.rs). This exact version is
# already in the tree through tauri's own dependencies, so it pulls in nothing
# new — it only lets us name the two Win32 calls directly.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
objc2-foundation = "0.3"

[dev-dependencies]
tempfile = "3"

