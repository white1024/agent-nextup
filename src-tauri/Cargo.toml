[package]
name = "agent-nextup"
version.workspace = true
description = "Agent NextUp desktop app: Tauri v2 shell hosting the workspace engine, project GUI and embedded agent terminal."
authors = ["white1024"]
edition = "2021"
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_nextup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nextup-core = { path = "../crates/nextup-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
portable-pty = "0.9"

# macOS quit path only (G065). Already in the tree via tao, so this pulls in
# nothing new — it just lets us name `NSApplication terminate:` directly,
# which is the one shutdown sequence AppKit does not crash on.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
objc2-foundation = "0.3"

[dev-dependencies]
tempfile = "3"

