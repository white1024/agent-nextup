<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent NextUp</title>

    <!-- Boot splash. The app bundle is a single ~1.2MB chunk (every view is a
         static import), so nothing at all painted between the window opening
         and React mounting — a blank window for as long as the webview needed
         to fetch, parse and run it. App.tsx has a loading state already, but
         it lives on the far side of that gap and so never covered it.

         The markup is inside #root on purpose: createRoot() clears the
         container on its first render, so the handoff needs no cleanup code
         and cannot leave an orphan overlay behind if React throws on the way
         up. App re-renders this same markup under this same class while it
         waits for its first IPC round trip — these rules are in <head> and so
         outlive #root — which is why the mark stays put instead of being
         swapped for a differently-shaped second loading screen. It carries an
         offset animation-delay to stay on one timeline; see lib/boot.ts.

         Everything here is inline and re-states token values, because
         styles.css arrives with that same bundle. Keep them in sync with the
         Colour block of src/styles.css — src/boot.test.ts fails if they
         drift. -->
    <script>
      window.__boot = { html: Date.now() };
      // Pin the theme before first paint. theme.ts does this too, but only
      // once the bundle has parsed — which is the very window this splash
      // exists to cover, so a dark-mode user would get a white flash first.
      // Same storage key and same semantics as getThemeMode().
      try {
        var mode = localStorage.getItem("nextup-theme");
        if (mode === "light" || mode === "dark") {
          document.documentElement.dataset.theme = mode;
          // The native title bar follows the same choice (D74) — and it had
          // the same problem one layer out: applyThemeMode() reaches it via
          // getCurrentWindow().setTheme(), which is in the bundle, so on a
          // machine whose OS theme differs from the pinned one the title bar
          // stayed light until the whole chunk had parsed.
          //
          // Tauri injects __TAURI_INTERNALS__ ahead of any page script, so the
          // command setTheme() ends up calling is already reachable here. That
          // is an internal rather than the public API on purpose: the public
          // one lives in the bundle we are trying to get ahead of. Reading the
          // label from metadata rather than hard-coding "main" keeps pop-out
          // terminal windows — same index.html, different window — correct.
          //
          // Best-effort by design: if the internal shape ever changes this
          // silently does nothing and applyThemeMode() still puts it right on
          // mount, which is exactly today's behaviour.
          var internals = window.__TAURI_INTERNALS__;
          if (internals && internals.metadata) {
            var pending = internals.invoke("plugin:window|set_theme", {
              label: internals.metadata.currentWindow.label,
              value: mode,
            });
            if (pending && pending.catch) pending.catch(function () {});
          }
        }
      } catch (err) {
        /* storage or the bridge can be unavailable; the app still corrects
           itself on mount, so there is nothing to report here */
      }
      // Pin the zoom before first paint, for the same reason and by the same
      // route as the theme above: zoom.ts applies it once the bundle has
      // parsed, so without this the splash paints at 1.0 and then jumps —
      // a size step on every single launch for anyone not at 100%.
      //
      // Same storage key and same snapping semantics as getZoom(): only the
      // offered steps are honoured, so a hand-edited value cannot be pinned
      // here into something no button can undo.
      try {
        var zoom = Number(localStorage.getItem("nextup-zoom"));
        var steps = [0.8, 0.9, 1, 1.1, 1.25]; /* ZOOM_STEPS */
        if (zoom && steps.indexOf(zoom) !== -1 && zoom !== 1) {
          var zi = window.__TAURI_INTERNALS__;
          if (zi && zi.metadata) {
            var zp = zi.invoke("plugin:webview|set_webview_zoom", {
              label: zi.metadata.currentWebview.label,
              value: zoom,
            });
            if (zp && zp.catch) zp.catch(function () {});
          }
        }
      } catch (err) {
        /* best-effort exactly like the theme pin: applyZoom() on mount is the
           authority, this is only earlier */
      }
    </script>

    <style>
      :root {
        color-scheme: light dark;
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: light-dark(#f3f2fa, #030306); /* --boot-bg */
        color: light-dark(#615e7c, #8e8aab); /* --text-3 */
        font-family: "Inter Tight", "Noto Sans TC", system-ui, "Microsoft JhengHei", sans-serif; /* --font */
      }

      /* C1 (D153/D154): a wireframe cube turns in and settles at the mark's
         angle, the app icon grows out of it with a flash, the name arrives
         letter by letter, then the subtitle. Pure CSS on purpose — this runs
         before the bundle exists, so the Web Animations API the rest of the
         design uses is not available yet.

         Every delay is counted from --boot-t0, the end of the hold. index.html
         leaves it at the hold itself; App re-renders this markup after
         createRoot() clears it and passes the elapsed time as a negative
         offset, so the one timeline carries on instead of restarting. */
      .boot {
        --boot-t0: 260ms;
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: light-dark(#f3f2fa, #030306); /* --boot-bg */
        /* Late enough that a fast boot never flashes it, early enough that a
           slow one stops looking broken. */
        animation: boot-in 200ms ease-out 260ms both;
      }
      .boot-c {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .boot-mark {
        position: relative;
        width: 168px;
        height: 168px;
      }
      .boot-flash {
        position: absolute;
        inset: -160px;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          light-dark(rgba(91, 79, 224, 0.45), rgba(255, 255, 255, 0.9)),
          light-dark(rgba(91, 79, 224, 0.14), rgba(160, 152, 255, 0.35)) 35%,
          transparent 70%
        );
        opacity: 0;
        pointer-events: none;
        animation: boot-flash 900ms ease-out calc(var(--boot-t0) + 1250ms) both;
      }
      .boot-cube-wrap {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        perspective: 2400px;
        /* Opacity lives on this wrapper, never on the cube: fading an element
           with preserve-3d flattens it to a single face in Chromium. */
        animation:
          boot-cube-in 160ms linear var(--boot-t0) both,
          boot-cube-out 260ms linear calc(var(--boot-t0) + 1250ms) forwards;
      }
      .boot-cube {
        position: relative;
        width: 54px;
        height: 54px;
        transform-style: preserve-3d;
        animation: boot-cube-turn 1300ms cubic-bezier(0.15, 0.7, 0.2, 1) var(--boot-t0) both;
      }
      .boot-cube i {
        position: absolute;
        inset: 0;
        border: 4.5px solid;
        border-color: light-dark(#4f43d6, #ffffff); /* --cube-line */
        border-radius: 3px;
        backface-visibility: hidden;
        box-shadow: 0 0 14px rgba(91, 79, 224, 0.35), inset 0 0 14px rgba(91, 79, 224, 0.18); /* --cube-glow */
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .boot-cube i {
          box-shadow: 0 0 18px rgba(170, 164, 255, 0.8), inset 0 0 18px rgba(170, 164, 255, 0.5);
        }
      }
      :root[data-theme="dark"] .boot-cube i {
        box-shadow: 0 0 18px rgba(170, 164, 255, 0.8), inset 0 0 18px rgba(170, 164, 255, 0.5);
      }
      .boot-cube i:nth-child(1) { transform: translateZ(27px); }
      .boot-cube i:nth-child(2) { transform: rotateY(180deg) translateZ(27px); }
      .boot-cube i:nth-child(3) { transform: rotateY(90deg) translateZ(27px); }
      .boot-cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(27px); }
      .boot-cube i:nth-child(5) { transform: rotateX(90deg) translateZ(27px); }
      .boot-cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(27px); }
      .boot-icon {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: boot-icon-on 250ms linear calc(var(--boot-t0) + 1250ms) forwards;
      }
      .boot-icon svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .boot-icon .lg-bg {
        transform-box: fill-box;
        transform-origin: center;
        animation: boot-icon-grow 650ms cubic-bezier(0.3, 1.4, 0.5, 1) calc(var(--boot-t0) + 1250ms) both;
      }
      .boot-name {
        color: light-dark(#17152b, #efedf9); /* --text-1 */
        font-size: 30px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.01em;
        white-space: pre;
      }
      .boot-name .ch {
        display: inline-block;
        animation: boot-ch 700ms cubic-bezier(0.16, 1, 0.3, 1)
          calc(var(--boot-t0) + 1450ms + var(--k) * 40ms) both;
      }
      .boot-sub {
        font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
        font-size: 11.5px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        animation: boot-sub 700ms cubic-bezier(0.16, 1, 0.3, 1) calc(var(--boot-t0) + 1750ms) both;
      }
      /* C226: a boot that is taking long keeps the mark beating once a second
         under the "taking longer than usual" line. Only App adds the class —
         by then the bundle is in — but the keyframes live here with the rest
         of the splash. */
      .boot.is-slow .boot-mark {
        animation: boot-pulse 1s ease-in-out infinite;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes boot-cube-in {
        from {
          opacity: 0;
        }
      }
      @keyframes boot-cube-out {
        to {
          opacity: 0;
        }
      }
      @keyframes boot-cube-turn {
        from {
          transform: rotateX(250deg) rotateY(-470deg) scale(0.35);
        }
        to {
          transform: rotateX(-35.264deg) rotateY(45deg) scale(1);
        }
      }
      @keyframes boot-icon-on {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-icon-grow {
        from {
          transform: scale(0);
          opacity: 0;
        }
      }
      @keyframes boot-flash {
        0% {
          opacity: 0;
          transform: scale(0.3);
        }
        20% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: scale(1.4);
        }
      }
      @keyframes boot-ch {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.9);
          filter: blur(10px);
        }
      }
      @keyframes boot-sub {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.045);
          opacity: 0.78;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        /* The result, at once: no cube, the icon and the words already there.
           `.boot` keeps its fade with a 1ms duration, so the hold still
           suppresses the splash on a fast boot instead of flashing it. */
        .boot {
          animation-duration: 1ms;
        }
        .boot-cube-wrap,
        .boot-flash {
          display: none;
        }
        .boot-icon,
        .boot-icon .lg-bg,
        .boot-name .ch,
        .boot-sub,
        .boot.is-slow .boot-mark {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite" aria-label="Starting Agent NextUp">
        <div class="boot-c">
          <div class="boot-mark">
            <i class="boot-flash"></i>
            <div class="boot-cube-wrap"><div class="boot-cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
            <!-- The app icon, identical to AppMark / IconLogo in src/components/icons.tsx -->
            <div class="boot-icon">
              <svg viewBox="0 0 1024 1024" aria-hidden="true">
                <defs>
                  <linearGradient id="boot-lga" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#6b63e8" />
                    <stop offset="1" stop-color="#4a42c0" />
                  </linearGradient>
                  <linearGradient id="boot-lgb" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#fff" stop-opacity=".16" />
                    <stop offset=".3" stop-color="#fff" stop-opacity="0" />
                  </linearGradient>
                </defs>
                <g class="lg-bg">
                  <rect width="1024" height="1024" rx="228" fill="url(#boot-lga)" />
                  <rect width="1024" height="1024" rx="228" fill="url(#boot-lgb)" />
                </g>
                <g
                  transform="translate(152 152) scale(30)"
                  fill="none"
                  stroke="#fff"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" />
                  <path d="M12 12l8-4.5M12 12v9M12 12L4 7.5" />
                </g>
              </svg>
            </div>
          </div>
          <div class="boot-name" aria-hidden="true"><span class="ch" style="--k: 0">A</span><span class="ch" style="--k: 1">g</span><span class="ch" style="--k: 2">e</span><span class="ch" style="--k: 3">n</span><span class="ch" style="--k: 4">t</span> <span class="ch" style="--k: 6">N</span><span class="ch" style="--k: 7">e</span><span class="ch" style="--k: 8">x</span><span class="ch" style="--k: 9">t</span><span class="ch" style="--k: 10">U</span><span class="ch" style="--k: 11">p</span></div>
          <div class="boot-sub" aria-hidden="true">nextup hub</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
