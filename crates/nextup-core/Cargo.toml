[package]
name = "nextup-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent NextUp domain core: workspace engine, security, tasks, ledger, handoff, backup. Zero Tauri/IPC dependencies (hexagonal core)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
argon2 = "0.5"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
parking_lot = "0.12"
fd-lock = "4"
walkdir = "2"
dirs = "6"
ureq = { version = "2", features = ["json"] }
rmcp = { version = "2.1.0", features = ["client", "transport-child-process", "transport-io"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "io-util", "time", "process"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
