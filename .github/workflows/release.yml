name: release

# B11 milestone one (D77): CI produces the multi-platform installers. This
# round does no OS code signing and no auto-update (D77 decisions 4 and 5), so
# the artifacts are unsigned trial builds.
#
# Trigger policy (D77 decision 1):
#   - push tag v*        -> build all three platforms; tauri-action opens a
#                           GitHub pre-release and attaches the installers.
#   - workflow_dispatch  -> manual test build: same three platforms, but no
#                           release; installers go up as workflow artifacts.
#
# Windows also produces a portable zip (scripts/make-portable.mjs) alongside its
# two installers, for machines where installing is what gets blocked.
#
# The sidecar (nextup-mcp) is built and staged into src-tauri/binaries/ by
# scripts/prepare-sidecar.mjs, which tauri.conf.json invokes from
# beforeBuildCommand. At bundle time tauri strips the target triple and places
# the binary next to the main executable (B11 batch 1, D25).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # tauri-action creates the GitHub release on tag builds

jobs:
  build:
    # CI belongs to the public mirror; this repo is the working directory and a
    # three-platform matrix (macOS runners bill at 10x) should not fire here on
    # its own. A manual dispatch still runs, which is how a change to this file
    # gets proven before the mirror inherits it. Tag pushes skip in this repo,
    # so releases can only originate from the mirror — which is also what the
    # updater endpoint requires (14 §3.3: a private repo's release assets are
    # not publicly downloadable).
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # x86_64-pc-windows-msvc
          - platform: ubuntu-22.04 # x86_64-unknown-linux-gnu
          - platform: macos-latest # aarch64-apple-darwin (Apple Silicon)
          # macos-13 (Intel x86_64) stalled on runner availability during the
          # first run and the first trial user was on an M1, so it was removed.
          # To cover Intel again, add `- platform: macos-13` back: a native
          # build, nothing else needs to change.
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux tauri deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches .npmrc use-node-version=24.18.0, the version pnpm runs scripts with
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Frontend unit tests (16 batch 12): the pure logic modules under src/.
      # Placed before the two builds because it is the cheapest step in the job
      # — under a second, no Rust, no dist/ — so a broken pure function surfaces
      # without waiting for a bundle.
      #
      # Non-blocking for the same reason as the cargo step below, and the two
      # should be hardened into gates together rather than one at a time: a
      # workflow where half the tests can stop a release and half cannot is
      # harder to reason about than either policy on its own.
      - name: Frontend unit tests (non-blocking)
        continue-on-error: true
        run: pnpm test

      # dist/ has to exist first: src-tauri's tauri-build script embeds
      # frontendDist while compiling agent-nextup, so without it cargo test
      # --workspace fails at that compile step — the false failure the first
      # CI run hit.
      - name: Build frontend (dist/ needed by src-tauri build script)
        run: pnpm build

      # The other half of the same problem as the line above, and it hid for far
      # longer. bundle.externalBin makes tauri-build resolve
      # binaries/nextup-mcp-<triple> while compiling agent-nextup, so cargo test
      # --workspace fails at that compile step unless the sidecar is already
      # staged. Until this step existed the cross-platform tests below failed on
      # every platform and every run, executing zero tests — continue-on-error
      # turned a hard failure into silence, and the job stayed green.
      #
      # Nearly free: tauri-action runs this same script from beforeBuildCommand a
      # step later, so this only moves the work earlier. The second call finds
      # the binary already built and cargo no-ops.
      - name: Stage the sidecar (needed by the src-tauri build script)
        run: node scripts/prepare-sidecar.mjs

      # B11 milestone one, item 4: cross-platform unit and integration tests.
      # Non-blocking (continue-on-error) — this round's priority is producing
      # trial installers, so a red cross-platform result surfaces in the log
      # without stopping the build. Hardening it into a gate comes later.
      - name: Cross-platform tests (non-blocking)
        continue-on-error: true
        run: cargo test --workspace

      - name: Build app + bundle
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Agent NextUp ${{ github.ref_name }} (trial)"
          # Point at a page that exists: the README has no "packaging" section,
          # and reference/building is where the per-OS dialogs are actually
          # written down.
          releaseBody: "Unsigned trial build: Windows and macOS warn about an unknown publisher on first launch, and nothing here updates itself. https://white1024.github.io/agent-nextup/reference/building/ has the way past each prompt, and the Linux notes. Windows also gets a portable zip that needs no installer at all."
          releaseDraft: false
          prerelease: true

      # A no-install option for Windows, where an installer is the thing that
      # gets blocked on a locked-down work machine. Runs after the bundle step
      # because it reuses that build's outputs — see the script header for why
      # the hub comes out of src-tauri/binaries/ and not target/release/.
      #
      # Windows only: Linux already gets a no-install format from the AppImage
      # above, and an unsigned mac .app served from a zip is worse off against
      # Gatekeeper than the dmg is.
      - name: Portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        run: node scripts/make-portable.mjs

      - name: Attach portable zip to the release (tag builds)
        if: ${{ matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh # explicit: this step is the only one whose body is PowerShell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = (Get-ChildItem target/portable/*.zip | Select-Object -First 1).FullName
          gh release upload $env:TAG $zip --clobber

      - name: Upload artifacts (manual dispatch — no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: nextup-${{ matrix.platform }}
          # Final installers only. `bundle/**/*` would also drag in the
          # AppImage build's intermediate appimage/*.AppDir/ (the unpacked app
          # plus every .so, ~257MB), duplicating the final .AppImage and
          # bloating the ubuntu artifact to 225MB. Hence the per-extension
          # allowlist.
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            target/portable/*.zip
          if-no-files-found: warn
